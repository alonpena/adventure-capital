[project]
name = "adventure-capital"
version = "0.1.0"
description = "MILP optimization model for accelerated growth planning"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1.6",
  "jsonschema>=4.20.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=6.8.0",
  "pulp>=2.8",
  "pyyaml>=6.0",
  "streamlit>=1.58.0",
  "weasyprint>=68.1",
]

[project.scripts]
adventure-capital = "adventure_capital.cli:main"

[dependency-groups]
dev = [
  "beautifulsoup4>=4.14.3",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
exclude = ["optimizacion_plan_crecimiento_acelerado_v3 (1).py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
