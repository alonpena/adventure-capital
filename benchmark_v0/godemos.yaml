# godemos.yaml — Plataforma B2C (membresías) + B2B (casting/demos/mentorías)
# Fuente: Modelamiento Financiero GoDemos (Excel de Alejandro Maureira)
# Moneda: USD | Horizonte: 36 meses
#
# SIMPLIFICACIONES DOCUMENTADAS:
# - B2C: membresías mensuales ($20.6) y anuales ($206) colapsadas a ARPU mensual
#   efectivo de ~$47/mes (pondera mix 90% mensual + 10% anual + recurrencia trimestral)
# - B2B: casting ($546.4), demos ($600) y mentorías ($150) colapsados a servicio
#   agregado con ticket ponderado ~$510 por evento, frecuencia trimestral
# - Adquisición B2B: 10/mes flat año 1 con MoM 3% años 2-3
# - Comisiones comerciales simplificadas a estructura rem_v + com_v uniforme
# - Publicidad no modelada como variable separada (absorbida en g_adm)
#
# TARGETS DE VALIDACIÓN CRUZADA (Excel original):
#   VAN:           2,005 MUS$ (~USD 2,005,099)
#   EBITDA yr1:    177 MUS$
#   EBITDA yr3:    2,139 MUS$
#   Revenue yr1:   303 MUS$
#   Revenue yr3:   2,315 MUS$
#   Breakeven:     mes 1 (cash-flow positive desde inicio)
#   Tolerancia:    ±20%

H: 36
VC: 0              # empresa ya operativa, sin inversión inicial requerida
operating_company: true  # exención DD03: VC=0 legítimo (empresa operando) → warning, no rechazo
beta: 0.35         # CAPM estandarizado (Excel usa 0.2823; 0.35 = convención AC)
g_max_suavizado: 0.25

servicios:
  # ────────────────────────────────────────────────────────
  # Servicio 1: Membresías B2C
  # Revenue B2C yr1 ≈ 172 MUS$, clientes promedio ≈ 303
  # ARPU mensual efectivo = 172K / 303 / 12 ≈ $47
  # Modelo: suscripción mensual con recompra mensual
  # ────────────────────────────────────────────────────────
  - nombre: Membresias_B2C
    ticket: 47             # ARPU mensual efectivo (Basic $17×70% + Pro $29×30% + recurrencia)
    frecuencia: 1          # mensual (SaaS subscription)
    alpha: 0.90            # 90% de clientes recompra (dato directo del Excel)
    churn_anual: [0.35, 0.33, 0.33]  # derivado de churn mensual 3.51%→3.32%→3.20%
    c_u: 0.10              # costo unitario plataforma tecnológica (Excel: $0.10/servicio)
    c_min: 100             # costo mínimo mensual operación tech (Excel directo)
    u_max: 1000            # capacidad máxima por escalón (Excel directo)
    A_base: [2, 16, 36, 38, 34, 14, 48, 42, 26, 12, 4, 2]  # plan de ventas B2C año 1

  # ────────────────────────────────────────────────────────
  # Servicio 2: Servicios B2B (Casting + Demos + Mentorías)
  # Revenue B2B yr1 ≈ 131 MUS$, clientes promedio ≈ 85
  # Recurrencia B2B: ~3 servicios/cliente/año → frecuencia = 4 meses
  # Ticket ponderado: casting 95% vol × $546 + demos/mentorías 5% → ~$510
  # ────────────────────────────────────────────────────────
  - nombre: Servicios_B2B
    ticket: 510            # ticket ponderado por servicio B2B
    frecuencia: 4          # trimestral (recurrencia B2B ≈ 3 servicios/año)
    alpha: 0.85            # tasa de recompra B2B
    churn_anual: [0.52, 0.31, 0.26]  # derivado de churn mensual 6%→3%→2.5%
    c_u: 1.50              # costo unitario blend (tech $0.10 + mentorías $20 ponderado)
    c_min: 500             # costo mínimo B2B (infraestructura de servicio)
    u_max: 50              # capacidad por escalón (limitado por equipo de casting)
    A_base: [10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10]  # B2B flat 10/mes

# ────────────────────────────────────────────────────────
# Estructura comercial
# Excel: 2 vendedores año 1, meta 5 clientes/vendedor/mes
# Nota: en GoDemos mucha adquisición es orgánica/plataforma,
# por lo que meta efectiva es mayor que la nominal
# ────────────────────────────────────────────────────────
meta: 15           # clientes/vendedor/mes ajustado (Excel: 5 nominal pero solo 2 sellers para ~33 clientes/mes)
sup: 99            # sin supervisores en GoDemos (Excel: 0 líderes)
rem_v: 1057        # sueldo bruto vendedor (CLP 951,435 / 900 ≈ $1,057)
rem_l: 1500        # placeholder (no hay líder de ventas)
com_v: 0.10        # comisión sobre ingreso nuevo (~$10/cliente, Excel: 30% × $20.6 membresía)
com_l: 0.05        # placeholder

# ────────────────────────────────────────────────────────
# Gastos fijos
# ────────────────────────────────────────────────────────
g_adm: 1400        # gastos admin $1,156 + publicidad $222 absorbida
RRHH_mensual: [6184, 6184, 6184]  # CEO 1.6M + COO 1.5M + otros 1.5M CLP brutos / 900

# ────────────────────────────────────────────────────────
# Capital de trabajo y valorización
# ────────────────────────────────────────────────────────
ciclo_op: [180, 120, 90]   # días ciclo operacional (dato directo Excel)
buffer_caja: 0
tax: 0.125                 # tasa impuesto 12.5% (dato directo Excel)

liquidity_policy:
  type: none

solver:
  name: cbc
  time_limit: 120
  verbose: false

commercial_productivity_lag: 0
